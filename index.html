<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laura Warrington's Online Written Reflection Academy</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--teal:#14b8a6;--tx:#fff;--mu:#94a3b8;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--red:#f87171;--amb:#fbbf24;--grn:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#134e4a55,transparent),radial-gradient(900px 500px at -10% 110%,#1e3a8a44,transparent),var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:16px}
.mu{color:var(--mu)}
.btn{background:var(--teal);color:#042f2e;border:0;border-radius:12px;padding:14px 24px;font-size:1rem;font-weight:700;cursor:pointer;min-height:48px;transition:.2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.field{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--teal);border-radius:12px;color:#fff;font-size:1.1rem;padding:14px;min-height:48px}
.vsvg{width:min(380px,92%);height:auto;display:block;margin:0 auto 14px}.vdoor{transform-box:view-box;transform-origin:44px 120px;animation:vopen 2.4s .9s cubic-bezier(.6,0,.3,1) forwards}@keyframes vopen{to{transform:scaleX(.1)}}
.lst{padding-left:20px}.lst li{margin:6px 0}
#hud{position:sticky;top:0;z-index:5;background:rgba(15,23,42,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.hud{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 16px;max-width:1040px;margin:0 auto}
.stat b{display:block;font-size:1.05rem}.stat small{color:var(--mu);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.lv{transition:.4s}.lv.pop{animation:pop .9s}
@keyframes pop{30%{transform:scale(1.25);color:var(--teal)}}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#5eead4);transition:width .6s}
.road{display:flex;gap:6px;padding:0 16px 10px;max-width:1040px;margin:0 auto;overflow-x:auto}
.node{flex:1;min-width:92px;text-align:center;font-size:.72rem;padding:6px 4px;border-radius:10px;border:1px solid var(--bd);color:var(--mu)}
.node.done{border-color:var(--teal);color:var(--teal);background:#14b8a622;box-shadow:0 0 12px #14b8a655}
.node.cur{border-color:#fff;color:#fff;animation:glow 2s infinite}
.node.lock{opacity:.5}
@keyframes glow{50%{box-shadow:0 0 18px var(--teal)}}
.hero{text-align:center;padding:48px 8px}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);letter-spacing:.12em}
.hero .sub{color:var(--teal);font-size:1.3rem;margin-bottom:24px}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.ref{border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0;background:rgba(0,0,0,.2)}
.row{display:flex;gap:10px;align-items:flex-start}
.row .mv{display:flex;flex-direction:column;gap:6px}
.mv button{background:var(--bg2);color:#fff;border:1px solid var(--bd);border-radius:8px;width:44px;height:44px;cursor:pointer;font-size:1rem}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{text-align:left;background:var(--bg2);color:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;font-size:.98rem;cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--teal)}.opt.sel{border-color:var(--teal);background:#14b8a622}
.opt.ok{border-color:var(--grn);background:#34d39922}.opt.bad{border-color:var(--red);background:#f8717122}
.fb{border-left:4px solid var(--teal);padding:10px 14px;background:rgba(20,184,166,.1);border-radius:0 10px 10px 0;margin:10px 0}
.fb.n{border-color:var(--amb);background:#fbbf2418}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:800px){.grid,.two{grid-template-columns:1fr!important}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ind{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:.9rem}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
.r{background:var(--red)}.a{background:var(--amb)}.g{background:var(--grn)}
.big{font-size:2.6rem;font-weight:800;color:var(--teal)}
.mine{min-height:120px;font-size:.98rem}
mark{border-radius:5px;padding:1px 3px;color:#fff}
.k0{background:#3b82f666}.k1{background:#a855f766}.k2{background:#f59e0b66}.k3{background:#14b8a688}.k4{background:#ec489966}.k5{background:#64748b88}.k6{background:#22c55e66}
.toast{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:20;background:var(--bg2);border:1px solid var(--teal);border-radius:14px;padding:12px 18px;box-shadow:0 8px 30px #000a;animation:ti .5s,to .5s 3.5s forwards}
@keyframes ti{from{transform:translateX(120%);opacity:0}}@keyframes to{to{opacity:0;transform:translateY(-10px)}}
.badges{display:flex;gap:8px;flex-wrap:wrap}.bdg{font-size:.78rem;border:1px solid var(--teal);color:var(--teal);border-radius:20px;padding:3px 10px}
.vault{height:200px;position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--teal);background:radial-gradient(circle,#14b8a655,#0f172a);margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;letter-spacing:.2em}
.vault i{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(#334155,#1e293b);border:1px solid #475569;animation:open 2.2s 1s forwards}
.vault i:first-child{left:0}.vault i:last-child{right:0;--d:1}
.vault i:first-child{--d:-1}
@keyframes open{to{transform:translateX(calc(var(--d)*100%))}}
.cert{border:3px double var(--teal);border-radius:12px;text-align:center;padding:36px 20px;background:linear-gradient(135deg,#0f172a,#134e4a)}
.cert h2{letter-spacing:.2em}
.cert input{background:transparent;border:0;border-bottom:1px solid var(--teal);color:#fff;font-size:1.5rem;text-align:center;width:min(380px,90%);margin:8px 0}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}.conf b{position:absolute;top:-10px;width:8px;height:14px;background:var(--teal);animation:fall 3.5s linear forwards;opacity:.8}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%;color:#000;background:#fff}.cert input{color:#000}}
</style></head>
<body>
<div id="hud"></div><div class="wrap" id="app"></div><div id="fx"></div>
<script>
const LV=[["Beginner",0],["Learner",50],["Developing Writer",100],["Skilled Writer",150],["Reflective Writer",250]];
const STG=["Reflection Detective","Marker Challenge","Reflection Minefield","Reflection Builder","Certification Vault"];
const CATS=["Context","Significant Event","Personal Response","Analysis","Self-Awareness","Learning","Future Action"];
const B=[ // builder options [text,score]
[["I completed a group activity during a workshop.",5],["During a teamwork workshop within the Professional Skills module, my group was required to develop a solution to a workplace scenario.",20],["Teamwork is widely regarded as one of the most important employability skills that employers in every sector look for in graduates, and it is something I have always considered central to long-term professional success.",0],["As part of a teamwork workshop, I worked with a small group to complete a problem-solving task.",15]],
[["Although the task was completed successfully, levels of participation varied considerably across the group.",15],["The workshop took place in a seminar room and lasted around one hour, during which we were given instructions, split into groups, and then allowed time to work through the scenario before a short plenary discussion at the end.",0],["Although the group completed the task successfully, one member dominated discussions while several others contributed very little.",20],["Some people contributed more than others.",5]],
[["I became aware that this imbalance affected my experience of the task.",15],["I hated the whole activity and thought it was a complete waste of time, because nothing about the session felt relevant, enjoyable or worth the effort I put into it.",-5],["I found this frustrating because it limited opportunities for wider discussion and idea sharing.",20],["I noticed what was happening.",5]],
[["One student spoke more than everyone else.",5],["Looking back, I think some group members lacked confidence in sharing their ideas while the dominant contributor may have been attempting to help the team progress efficiently.",20],["Group work can sometimes be difficult for a wide range of reasons, and there are many different factors that can affect how well a team works together in any particular situation or setting.",0],["The different levels of participation may have resulted from differing levels of confidence and engagement.",15]],
[["I recognised that I could have contributed more actively when participation became uneven.",15],["I remained quiet during the discussion.",5],["Reflecting on the experience, I realised I was reluctant to challenge the situation because I wanted to avoid creating tension within the group.",20],["The issue was entirely caused by other members, who clearly did not make enough effort to share the work fairly, listen to anyone else or take the task as seriously as they should have.",-10]],
[["This experience highlighted that effective teamwork requires active management of participation rather than assuming everyone will contribute equally.",20],["The activity demonstrated some challenges that can occur within teams.",10],["The experience reinforced the importance of creating opportunities for all team members to contribute.",15],["Teamwork is an extremely important skill in modern organisations, and this activity reminded me of just how valuable it is to be able to work well with other people in the workplace.",5]],
[["In future collaborative tasks, I would establish expectations earlier and be more willing to address participation issues constructively.",20],["This problem will never happen again, because I now know exactly how to work in a team and will make sure that everything goes smoothly in every group I join from now on.",-5],["In future group activities, I would actively look for opportunities to encourage wider participation.",15],["I hope that my future teamwork experiences are better than this one and that the people I work with are more cooperative, organised and easy to get along with.",5]]];
const HINT=["Your context could be more specific about the module and the task.","Your key event is too general – say exactly what happened and its effect.","Your personal response needs to explain how you felt and why it mattered.","Your analysis could be developed further – explore causes, not just events.","Your reflection would benefit from greater self-awareness of your own behaviour.","Your learning is generic – state what the experience taught you specifically.","Your future action is currently vague – say what you would actually do differently."];
const DET={A:"Reflection A",B:"Reflection B",C:"Reflection C"};
const DT={A:"During a teamwork workshop, we worked in groups to solve a workplace problem. There were five members in my group. We discussed ideas and completed the task successfully. One member spoke more than others during the discussion. The workshop was useful and helped me understand teamwork.",
B:"During a teamwork workshop, my group worked together to solve a workplace problem. Although we completed the task successfully, participation was uneven, with one member contributing far more than others. I found this frustrating because it reduced opportunities for wider discussion. The experience highlighted the importance of ensuring all team members are able to contribute. In future group tasks, I would encourage broader participation earlier in the process.",
C:"During a teamwork workshop, my group was required to solve a workplace problem. Although the task was completed successfully, one member dominated discussion while several others remained largely silent. I found this frustrating because it limited opportunities for idea sharing. Reflecting on my own behaviour, I realised I avoided challenging the imbalance because I was concerned about creating tension within the group. Looking back, I recognise that differing levels of confidence may have contributed to the situation. This experience highlighted the importance of actively managing participation rather than assuming everyone will contribute equally. In future collaborative tasks, I would establish expectations earlier and be more willing to address participation issues constructively."};
const MK=["Description","Analysis","Self-awareness","Learning","Future action"];
const MKQ=[["During a teamwork workshop, my group was asked to solve a workplace problem.",0,"This sets the scene and states what happened. It is description – necessary, but it earns few marks alone."],["I think the imbalance arose because quieter members lacked confidence, while the dominant speaker was trying to move us forward.",1,"This offers possible causes and weighs perspectives – the hallmark of analysis."],["I realised I avoided challenging the situation because I wanted to prevent tension.",2,"This examines the writer's own behaviour and motives – self-awareness."],["This highlighted that participation needs active management rather than being assumed.",3,"This extracts a transferable lesson from the experience – learning."],["Next time, I will agree contribution expectations with the group at the start of the task.",4,"This is a specific, practical commitment – future action."]];
const MN=["Over-description (events listed, nothing explained)","Blaming others (own part ignored)","Vague conclusion (no specific detail)","No learning (no lesson is stated)","No future action (nothing is planned)","Generic employability statement"];
const MNQ=[["The workshop began at 10am. We sat at round tables, received the brief, discussed it, made notes, presented, and then had a break.",0,"This describes events but does not explain why they mattered. Marks are earned through analysis, not narrative."],["The task went badly because the other members refused to listen and did not take it seriously, so there was nothing I could have done.",1,"This shifts responsibility onto others and shows limited self-awareness. Mentioning other people is fine, but it becomes blaming when the writer excuses their own part. Strong reflective writing requires you to critically evaluate your own actions and learning."],["Overall, it was a positive experience and things worked out well in the end.",2,"This conclusion is vague: it gives no specific detail about what was positive or why it mattered."],["I felt frustrated because the discussion was uneven. Next time I will ask the group to take turns.",3,"This states a feeling and an action, but never explains why the imbalance happened or what the experience taught the writer. Without a stated lesson, the reflection is incomplete."],["The discussion was uneven, which I found frustrating. I think some members lacked confidence, and this taught me that participation has to be actively managed.",4,"This explains causes and states a lesson, but says nothing about what the writer will do differently. Future action is missing."],["Teamwork is a key employability skill that all employers value.",5,"A generic claim could be written without having had the experience. It is not personal, specific or evidenced."]];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rk=()=>{let r;do r=sh(["A","B","C"]);while(r.join("")=="CBA");return r};
let S={st:"intro",xp:0,b:[],done:0,rank:rk(),lp:0,lerr:false,bres:null,qmk:sh(MKQ),qmn:sh(MNQ),lo:{mk:sh([0,1,2,3,4]),mn:sh([0,1,2,3,4,5])},ord:B.map(o=>sh(o.map((_,i)=>i))),tries:0,best:null,res:false,last:0,mk:[],mn:[],pick:{},snap:null,s1:0,s2:0,cur:0,fb:null,name:"",lastLv:0};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const lvl=()=>{let l=0;LV.forEach((x,i)=>{if(S.xp>=x[1])l=i});return l};
function toast(a,t){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.innerHTML=`<small class="mu">${a}</small><br><b>${t}</b>`;$("fx").appendChild(d);setTimeout(()=>d.remove(),4200)}
function xp(n){S.xp+=n;toast("+"+n+" points","Level progress")}
const val=(c,p)=>B[c][p][1], total=p=>Object.keys(p).reduce((a,c)=>a+val(+c,p[c]),0);
const pct=p=>Math.max(0,Math.round(total(p)/140*100));
const cls=s=>s>=80?["Advanced Reflective Writer","Your reflection demonstrates strong analysis, self-awareness, learning and future action."]:s>=60?["Competent Reflective Writer","Your reflection demonstrates emerging reflection and learning."]:["Emerging Reflective Writer","Your reflection contains description but requires deeper analysis and self-awareness."];
const col=v=>v===undefined||v<=0?"r":v<15?"a":"g";
const para=p=>CATS.map((_,i)=>p[i]!==undefined?B[i][p[i]][0]:"").filter(Boolean).join(" ");
function hud(){const l=lvl(),p=Math.round(S.done/5*100);
$("hud").innerHTML=`<div class="hud"><div class="stat"><small>Points</small><b>${S.xp}</b></div><div class="stat"><small>Level ${l+1}</small><b class="lv ${l!=S.lastLv?"pop":""}">${LV[l][0]}</b></div><div class="stat" style="min-width:120px"><small>Progress ${p}%</small><div class="bar"><i style="width:${p}%"></i></div></div></div>
<div class="road" role="list">${STG.map((s,i)=>`<div role="listitem" class="node ${i<S.done?"done":i==S.done&&S.st!="intro"&&S.st!="learn"?"cur":"lock"}">${i+1}. ${i<S.done?"✓ ":false?"":""}${s}</div>`).join("")}</div>`;S.lastLv=l}
function go(st){S.st=st;S.fb=null;render();scrollTo(0,0)}
function render(){hud();const f={intro,learn,detective,marker,mine,builder,vault}[S.st];$("app").innerHTML=f();bind()}
function bind(){}
/* intro */
function intro(){return `<div class="hero card"><div class="tag">Laura Warrington's Online Written Reflection Academy</div><h1>REFLECTION ACADEMY</h1><div class="sub">Build Strong Reflective Writing</div><div style="max-width:640px;margin:0 auto 24px;text-align:left"><p>Reflective writing is not simply describing what happened.</p><p>Strong reflective writing demonstrates analysis, self-awareness, learning, and future action.</p><p>In this academy you will complete a series of increasingly difficult reflection challenges designed to help you develop strong reflective writing skills.</p><p><b>Your mission is to unlock the Certification Vault.</b></p></div><button class="btn" onclick="go('learn')">BEGIN ACADEMY</button></div>`}
/* learning */
const LEARN=[
()=>`<h2>Welcome to the Academy</h2><p>No experience of reflective writing is needed. Before the challenges begin, you will learn the basics step by step.</p><label for="nm"><b>Your name, as you would like it to appear on your certificate:</b></label><br><input id="nm" class="field" maxlength="60" autocomplete="name" placeholder="e.g. Alex Morgan" value="${esc(S.name)}" oninput="S.name=this.value">${S.lerr?'<p style="color:var(--amb)">Please enter your name to continue.</p>':""}<div class="fb n" style="margin-top:18px"><b>Before you start – how the Academy works</b><ul class="lst"><li>Once you start a challenge you <b>cannot go back</b> to an earlier one.</li><li>If you do not reach the required score you <b>can restart and resubmit</b> that challenge.</li><li>Challenges 1–3 need <b>full marks</b> before the next stage unlocks.</li><li>The Reflection Builder is the final challenge and needs <b>70%</b>. You can revise and resubmit to improve your mark.</li><li>Your best mark appears on your certificate.</li></ul></div>`,
()=>`<h2>What is reflective writing?</h2><p>Reflective writing is not just <i>telling the story</i> of what happened. It explains what the experience meant, what it showed you about yourself, and what you will do differently.</p><div class="two"><div class="ref"><b>Descriptive</b><p>“I gave a presentation. It lasted five minutes. People asked questions afterwards.”</p><p class="mu">Says what happened, but nothing about why it mattered.</p></div><div class="ref"><b style="color:var(--teal)">Reflective</b><p>“I rushed my presentation because I was nervous, so the audience had little time to take in the key points. I now see that I need to practise delivery, not just content.”</p><p class="mu">Explains, links to yourself and looks forward.</p></div></div><h3>A simple three-question model</h3><ol class="lst"><li><b>What?</b> What happened?</li><li><b>So what?</b> Why did it matter, and what does it tell me about myself?</li><li><b>Now what?</b> What will I do differently next time?</li></ol><p class="mu">Most marks are earned in the second and third questions.</p>`,
()=>`<h2>The five building blocks</h2><p class="mu">Strong reflections combine five elements. Each is shown with a question to ask yourself and an example from a presentation.</p>${[["Description","What happened?","Sets the scene briefly. Keep it short: it is the foundation, not the answer.","I delivered a five-minute presentation to my seminar group on market entry strategy."],["Analysis","Why did it happen, and what effect did it have?","Explores causes, consequences and other viewpoints.","My nerves probably made me rush, which left the audience little time to absorb the key figures."],["Self-awareness","What was my own part in it?","Looks honestly at your feelings, behaviour and assumptions, not just other people's.","I realised I had avoided rehearsing aloud because I was uncomfortable hearing myself speak."],["Learning","What have I learned that applies beyond this event?","Draws a specific lesson, not a general statement like “presenting is important”.","I learned that preparation is not only about content but also about practising delivery."],["Future action","What will I do differently next time?","A specific, realistic commitment, not a hope or an absolute promise.","For my next presentation I will rehearse aloud twice and time myself against the limit."]].map((x,i)=>`<div class="ref"><b><mark class="k${i}">${x[0]}</mark></b> – ${x[1]}<p style="margin:6px 0">${x[2]}</p><p class="mu" style="margin:0"><i>“${x[3]}”</i></p></div>`).join("")}`,
()=>`<h2>Putting it together</h2><p>A strong reflective paragraph usually follows this flow. You will use exactly this structure in the Reflection Builder.</p><ol class="lst"><li><b>Context</b> – where and what, in one specific sentence.</li><li><b>Significant event</b> – the moment that mattered.</li><li><b>Personal response</b> – how you felt, and why.</li><li><b>Analysis</b> – possible reasons and effects.</li><li><b>Self-awareness</b> – your own behaviour and motives.</li><li><b>Learning</b> – a specific lesson.</li><li><b>Future action</b> – what you will actually do.</li></ol><div class="fb"><b>Tip for the Reflection Builder:</b> when you choose between options, a longer sentence is not automatically a stronger one. Look for options that are <b>specific, honest and explain why</b>.</div><h3>Common ways to lose marks</h3><ul class="lst"><li><b>Over-description:</b> a long narrative with no explanation.</li><li><b>Blaming others:</b> excusing yourself by blaming other people. You can mention what others did, but always examine your own part too.</li><li><b>Vague conclusions:</b> “it was a good experience”.</li><li><b>No learning:</b> reporting events without drawing out a lesson.</li><li><b>No future action:</b> no statement of what will change.</li><li><b>Generic employability statements:</b> claims anyone could write.</li></ul>`,
()=>`<h2>Reflective Writing Levels to complete</h2><p>You will work through five levels. Each one builds on the last.</p><ol class="lst"><li><b>Reflection Detective</b> – rank three reflections from strongest to weakest (full marks needed).</li><li><b>Marker Challenge</b> – identify the five building blocks (full marks needed).</li><li><b>Reflection Minefield</b> – spot the writing choices that lose marks (full marks needed).</li><li><b>Reflection Builder (final challenge)</b> – build your own reflection (70% needed).</li><li><b>Certification Vault</b> – unlock the vault and collect your certificate.</li></ol><p class="mu">Your best Reflection Builder mark will appear on your certificate.</p>`];
function learn(){const p=S.lp;return `<div class="card"><span class="tag">Introduction · Page ${p+1} of 5</span>${LEARN[p]()}<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">${p>0?`<button class="btn ghost" onclick="S.lp--;render();scrollTo(0,0)">← Back</button>`:""}<button class="btn" onclick="lnext()">${p<4?"Next →":"Start Reflection Detective →"}</button></div></div>`}
function lnext(){if(S.lp==0&&!S.name.trim()){S.lerr=true;render();return}S.lerr=false;if(S.lp<4){S.lp++;render();scrollTo(0,0)}else go("detective")}
/* 1 detective */
function mv(i,d){const r=S.rank,j=i+d;if(j<0||j>2)return;[r[i],r[j]]=[r[j],r[i]];render()}
function chkDet(){const ok=S.rank.join("")=="CBA";S.fb=ok?"ok":"no";if(ok&&S.done<1){S.done=1;xp(50)}render()}
function detective(){return `<div class="card"><span class="tag">Level 1</span><h2>Reflection Detective</h2><p class="mu">You are acting as a university marker. Rank these reflections from <b>highest</b> (top) to <b>lowest</b> quality using the arrows.</p>${S.rank.map((k,i)=>`<div class="ref row"><div class="mv"><button aria-label="Move ${DET[k]} up" onclick="mv(${i},-1)">▲</button><button aria-label="Move ${DET[k]} down" onclick="mv(${i},1)">▼</button></div><div><b>#${i+1} · ${DET[k]}</b><p style="margin:4px 0 0">${DT[k]}</p></div></div>`).join("")}
${S.fb=="ok"?`<div class="fb"><b>Correct: C, B, A.</b><p><b>C</b> is strongest: it examines the writer's own behaviour (avoiding tension), considers causes (confidence levels), draws a specific lesson and commits to concrete action.</p><p><b>B</b> shows feeling, a lesson and an intention, but never analyses why the imbalance happened or the writer's own part in it.</p><p><b>A</b> is almost entirely description: it names the event and calls it "useful" without analysis, emotion, learning or action.</p></div><button class="btn" onclick="go('marker')">Next: Marker Challenge →</button>`:`${S.fb=="no"?`<div class="fb n">Not quite. Look for who analyses causes, examines their own behaviour and commits to specific action.</div>`:""}<button class="btn" onclick="chkDet()">Check my ranking</button>`}</div>`}
/* generic quiz */
function quiz(title,lvlN,intro,Q,labels,arr,order,key){
const i=S.cur;if(i>=Q.length){const sc=arr.filter((a,j)=>a==Q[j][1]).length,full=sc==Q.length;return `<div class="card"><h2>${title} – results</h2><p>You scored <b>${sc}/${Q.length}</b>.</p>${full?`<div class="fb"><b>Full marks.</b> Excellent – the next stage is unlocked.</div><button class="btn" onclick="fin('${key}')">Continue →</button>`:`<div class="fb n">Full marks are required to unlock the next stage. Restart the challenge and try again – the questions and answers will appear in a new order.</div><button class="btn" onclick="restartQ('${key}')">Restart challenge</button>`}</div>`}
const q=Q[i],a=arr[i];
return `<div class="card"><span class="tag">Level ${lvlN} · Question ${i+1}/${Q.length}</span><h2>${title}</h2><p class="mu">${intro}</p><div class="ref"><p style="margin:0;font-size:1.1rem">“${q[0]}”</p></div><div class="opts">${order.map(j=>`<button class="opt ${a!==undefined?(j==q[1]?"ok":j==a?"bad":""):""}" ${a!==undefined?"disabled":""} onclick="ans('${key}',${j})">${labels[j]}</button>`).join("")}</div>${a!==undefined?`<div class="fb ${a==q[1]?"":"n"}"><b>${a==q[1]?"Correct.":"Not quite."}</b> ${q[2]}</div><button class="btn" onclick="S.cur++;render()">${i<Q.length-1?"Next →":"See results →"}</button>`:""}</div>`}
function restartQ(k){if(k=="mk"){S.mk=[];S.qmk=sh(MKQ);S.lo.mk=sh([0,1,2,3,4])}else{S.mn=[];S.qmn=sh(MNQ);S.lo.mn=sh([0,1,2,3,4,5])}S.cur=0;render();scrollTo(0,0)}
function ans(k,j){(k=="mk"?S.mk:S.mn)[S.cur]=j;render()}
function fin(k){S.cur=0;if(k=="mk"){if(S.done<2){S.done=2;xp(50)}go("mine")}else{if(S.done<3){S.done=3;xp(50)}go("builder")}}
function marker(){return quiz("Marker Challenge",2,"Which reflective writing component does this extract demonstrate?",S.qmk,MK,S.mk,S.lo.mk,"mk")}
function mine(){return quiz("Reflection Minefield",3,"Each statement has one main weakness that would lose marks. Which description fits best? <br><b>Note:</b> mentioning other people is fine and often necessary. It only loses marks when you blame them instead of examining your own part.",S.qmn,MN,S.mn,S.lo.mn,"mn")}
/* 4 builder */
function pk(c,p){S.pick[c]=p;render()}
function panel(p,hide){const sc=pct(p),[c]=cls(sc);const txt=`<h3>MY REFLECTION</h3><p class="mine">${para(p)||'<span class="mu">Your reflection will build here as you choose…</span>'}</p>`;
if(hide)return `<div class="card" aria-live="polite">${txt}<hr style="border-color:var(--bd)"><p class="mu">Your score is revealed when you submit.</p></div>`;
return `<div class="card" aria-live="polite">${txt}<hr style="border-color:var(--bd)">${hide===2?`<p class="mu">Your score is revealed after you submit.</p>`:`<div class="mu" style="font-size:.8rem">CURRENT REFLECTION SCORE</div><div class="big">${sc}<span style="font-size:1rem" class="mu">/100</span></div><div class="mu" style="margin-bottom:8px">${Object.keys(p).length?c:""}</div>`}<div class="mu" style="font-size:.8rem">STRENGTH ANALYSIS</div>${CATS.map((n,i)=>`<div class="ind"><span>${n}</span><span><i class="dot ${col(p[i]!==undefined?val(i,p[i]):undefined)}"></i><small class="mu">${{r:"Missing",a:"Developing",g:"Strong"}[col(p[i]!==undefined?val(i,p[i]):undefined)]}</small></span></div>`).join("")}</div>`}
function builder(){if(S.res)return result();
const n=Object.keys(S.pick).length,c=Math.min(n,6);
return `<div class="grid"><div class="card"><span class="tag">Level 4 · Final Challenge</span><h2>Reflection Builder</h2><p class="mu">Construct a strong reflection. Choose one option for each step (you can change your mind before submitting). Your score is revealed when you submit. You need <b>70%</b> to progress, and you can revise and resubmit to improve your mark.</p>${CATS.map((cn,i)=>`<h3 style="margin-top:20px">Step ${i+1} · ${cn}</h3><div class="opts" role="radiogroup" aria-label="${cn}">${S.ord[i].map(j=>`<button role="radio" aria-checked="${S.pick[i]===j}" class="opt ${S.pick[i]===j?"sel":""}" onclick="pk(${i},${j})">${B[i][j][0]}</button>`).join("")}</div>`).join("")}<button class="btn" ${n<7?"disabled":""} onclick="finB()">Submit reflection</button></div><div style="position:sticky;top:130px;align-self:start">${panel(S.pick,2)}</div></div>`}
function finB(){const sc=pct(S.pick);S.tries++;S.last=sc;S.acc=false;if(!S.best||sc>=S.s2){S.s2=sc;S.best={...S.pick}}
const p=S.best;
if(S.s2>=70&&S.done<4){S.done=4;xp(100)}S.res=true;render();scrollTo(0,0)}
const hl=p=>CATS.map((_,i)=>p[i]!==undefined?`<mark class="k${i}">${B[i][p[i]][0]}</mark>`:"").join(" ");
const LEG=CATS.map((c,i)=>`<mark class="k${i}">${c}</mark>`).join(" ");
function result(){const sc=S.s2,[c,d]=cls(sc),ok=sc>=70,p=S.best,wk=CATS.map((_,i)=>i).filter(i=>val(i,p[i])<20);
const areas=wk.length?`<p style="margin:10px 0 0"><b>${ok?"Areas you could still strengthen:":"Areas to strengthen:"}</b></p><ul class="lst">${wk.map(i=>`<li>${HINT[i]}</li>`).join("")}</ul>Choose responses that are specific, explain why, examine your own part and commit to concrete action.`:"";
return `<div class="card"><span class="tag">Level 4 · Final Challenge results</span><h2>${sc==100?"Well done – full marks":ok?"Reflection accepted":"Not quite there yet"}</h2>
<div class="${S.tries>1?"two":""}"><div class="card" style="margin:0"><div class="mu">${S.tries>1?"BEST SCORE":"YOUR SCORE"}</div><div class="big">${sc}%</div></div>${S.tries>1?`<div class="card" style="margin:0"><div class="mu">LATEST ATTEMPT</div><div class="big">${S.last}%</div></div>`:""}</div>
${sc==100?`<div class="fb"><b>Well done.</b> You selected the strongest response in every section. ${d}</div>`:ok?`<div class="fb"><b>${c}.</b> ${d} You have passed the 70% threshold. You can continue now, or revise to improve your mark. Your best mark will be shown on your certificate.${areas}</div>`:`<div class="fb n"><b>You need at least 70% to progress.</b>${areas}</div>`}
<h3>Your reflection</h3><div class="ref">${hl(p)}</div><p style="font-size:.85rem">${LEG}</p>
${sc==100?UNL:`${!S.acc?`<button class="btn ghost" onclick="S.res=false;render();scrollTo(0,0)">${ok?"Revise to improve my mark":"Revise my reflection"}</button> `:""}${ok&&!S.acc?`<button class="btn" onclick="accept()">Accept this mark and continue →</button>`:""}`}</div>${S.acc&&ok&&sc<100?`<div id="rem">${exemplar()}</div><div style="text-align:center">${UNL}</div>`:""}`}
const UNL=`<button class="btn" onclick="openV()">Unlock the Certification Vault →</button>`;
function accept(){S.acc=true;render();document.getElementById("rem").scrollIntoView({behavior:"smooth"})}
function exemplar(){const ex=B.map(o=>o.findIndex(x=>x[1]==20));
return `<div class="card"><h2>A reminder: the strongest response</h2><p>You accepted a mark below 100%, so here is a reminder of the strongest response you could have selected at each step. Please keep this in mind when reflecting within this module.</p><div class="ref">${hl(Object.fromEntries(ex.map((j,i)=>[i,j])))}</div><p style="font-size:.85rem">${LEG}</p><div class="fb"><b>Why it works.</b> It places the event in a specific context, explains <i>why</i> participation was uneven by weighing two perspectives (analysis), admits the writer's own role (self-awareness), turns this into a transferable principle (learning) and commits to concrete actions (future action). It is not longer – it is deeper.</div></div>`}
function openV(){if(S.done<5){S.done=5;xp(50)}go("vault");confetti()}
function vaultSvg(){const bolts=Array.from({length:16},(_,i)=>{const a=i*Math.PI/8;return `<circle cx="${(160+77*Math.cos(a)).toFixed(1)}" cy="${(120+77*Math.sin(a)).toFixed(1)}" r="2.6" fill="#14b8a6"/>`}).join("");
const spokes=Array.from({length:6},(_,i)=>{const a=i*Math.PI/3,x=160+52*Math.cos(a),y=120+52*Math.sin(a);return `<line x1="${(160+22*Math.cos(a)).toFixed(1)}" y1="${(120+22*Math.sin(a)).toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#14b8a6" stroke-width="3"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/>`}).join("");
return `<svg class="vsvg" viewBox="0 0 320 240" role="img" aria-label="A secure vault door swinging open"><defs><radialGradient id="vg"><stop offset="0" stop-color="#14b8a6" stop-opacity=".55"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient></defs>
<rect x="30" y="12" width="260" height="216" rx="16" fill="none" stroke="#14b8a6" stroke-opacity=".55" stroke-width="2.5"/><rect x="42" y="24" width="236" height="192" rx="10" fill="#0b1220" stroke="#14b8a6" stroke-opacity=".3" stroke-width="1.5"/>
<circle cx="160" cy="120" r="90" fill="url(#vg)"/><g fill="none" stroke="#5eead4" stroke-width="1.8"><rect x="112" y="84" width="96" height="72" rx="4"/><line x1="126" y1="104" x2="194" y2="104"/><line x1="126" y1="118" x2="194" y2="118"/><line x1="126" y1="132" x2="170" y2="132"/><circle cx="188" cy="136" r="8"/></g>
<g class="vdoor"><circle cx="160" cy="120" r="86" fill="#0f172a" stroke="#14b8a6" stroke-width="3"/><circle cx="160" cy="120" r="68" fill="none" stroke="#14b8a6" stroke-opacity=".6" stroke-width="1.5"/>${bolts}${spokes}<circle cx="160" cy="120" r="22" fill="#0f172a" stroke="#14b8a6" stroke-width="2.5"/><circle cx="160" cy="120" r="7" fill="#14b8a6"/></g>
<rect x="22" y="56" width="14" height="26" rx="3" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/><rect x="22" y="158" width="14" height="26" rx="3" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/></svg>`}
function vault(){const c=cls(S.s2),n=esc(S.name.trim()||"Student");const d=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
return `<div class="card" style="text-align:center"><span class="tag">Final Stage</span><h2>The Certification Vault</h2>${vaultSvg()}<h3 style="margin:0">Well done, ${n}</h3><p style="margin:4px 0 0">Your certificate is ready.</p></div>
<div class="cert card"><div class="tag">Laura Warrington's</div><h2>ONLINE WRITTEN REFLECTION ACADEMY</h2><div class="mu">Certificate of Completion</div><p class="mu">This certifies that</p><h2 style="letter-spacing:.04em;font-size:1.9rem;border-bottom:1px solid var(--teal);display:inline-block;padding:0 24px 4px">${n}</h2><p class="mu">has completed the Online Written Reflection Academy and is awarded the title of</p><h3 style="color:var(--teal)">${c[0]}</h3><p>Reflection Builder mark: <b>${S.s2}%</b> · Date completed: <b>${d}</b></p></div>
<p style="text-align:center"><button class="btn ghost" onclick="print()">Print certificate</button></p>
<div class="card"><h2>What Makes a Strong Reflection?</h2><p><b>Strong reflections:</b></p><p>✓ Move beyond description<br>✓ Explore causes and consequences<br>✓ Demonstrate self-awareness<br>✓ Identify meaningful learning<br>✓ Explain how future behaviour will change</p><p>Reflection is a skill developed through practice. Small improvements in analysis, self-awareness and action planning can significantly improve academic performance.</p><h2 style="text-align:center;color:var(--teal);letter-spacing:.2em;margin-top:24px">REFLECTION ACADEMY COMPLETE</h2><p style="text-align:center">You are welcome to upload your certificate to your LUBS5907 workbook.</p></div>`}
function confetti(){const f=$("fx"),c=document.createElement("div");c.className="conf";c.setAttribute("aria-hidden","true");for(let i=0;i<50;i++){const b=document.createElement("b");b.style.left=Math.random()*100+"%";b.style.animationDelay=Math.random()*1.5+"s";b.style.background=["#14b8a6","#5eead4","#fff","#94a3b8"][i%4];c.appendChild(b)}f.appendChild(c);setTimeout(()=>c.remove(),5500)}
render();
</script></body></html>
